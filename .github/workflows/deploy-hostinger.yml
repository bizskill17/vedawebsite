name: Deploy VEDA to Hostinger
on:
  push:
    branches: [main]
    paths: ['dist/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview uploads without changing server files
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: hostinger-veda-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Deploy through explicit FTPS on port 21
        shell: python
        run: |
          import ftplib, os, ssl
          from pathlib import Path
          for key in ("FTP_SERVER", "FTP_USERNAME", "FTP_PASSWORD"):
              if not os.environ.get(key):
                  raise SystemExit(f"Missing GitHub secret: {key}")
          host = os.environ["FTP_SERVER"]
          if "://" in host or "/" in host:
              raise SystemExit("FTP_SERVER must be a hostname or IP without ftp://")
          root = Path("dist")
          if not (root / "index.html").is_file():
              raise SystemExit("dist/index.html is missing")
          files = sorted(p for p in root.rglob("*") if p.is_file())
          if any(p.is_symlink() for p in root.rglob("*")):
              raise SystemExit("Symlinks are not supported")
          dry = os.environ.get("DRY_RUN") == "true"
          # Fail on TLS/certificate errors; never fall back to plaintext FTP.
          with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=60) as ftp:
              ftp.connect("82.180.165.180", 21)
              # Connect to VEDA's known IPv4 endpoint, retaining the supplied
              # hostname for TLS SNI and certificate verification.
              ftp.host = host
              ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
              ftp.prot_p()
              ftp.voidcmd("TYPE I")
              ftp.cwd("public_html")
              try:
                  ftp.size("index.php")
              except ftplib.error_perm as exc:
                  if not str(exc).startswith("550"):
                      raise
              else:
                  raise SystemExit("index.php remains in public_html. Review and back up the old WordPress entry point before deploying.")
              for path in files:
                  relative = path.relative_to(root)
                  print(("Would upload: " if dry else "Uploading: ") + relative.as_posix())
                  if dry:
                      continue
                  ftp.cwd("/")
                  ftp.cwd("public_html")
                  for part in relative.parts[:-1]:
                      try:
                          ftp.mkd(part)
                      except ftplib.error_perm as exc:
                          if not str(exc).startswith("550"):
                              raise
                      ftp.cwd(part)
                  with path.open("rb") as source:
                      ftp.storbinary("STOR " + relative.name, source)
          # Upload only: no remote delete commands or subdomain traversal.
